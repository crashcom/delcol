<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Jogo - Del Col Pizzaria</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      background: linear-gradient(135deg, #111 0%, #222 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 5px 0 2px 0;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      color: #ffcc00;
      text-shadow: 0 0 15px #ff6600;
      text-align: center;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 15px #ff6600; }
      to { text-shadow: 0 0 25px #ffcc00, 0 0 35px #ff6600; }
    }
    .instructions {
      margin-bottom: 12px;
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      font-weight: bold;
      color: #0f0;
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
      text-align: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: min(65vh, 580px);
      background: radial-gradient(circle at center, #001100 0%, #000 100%);
      border: 4px solid #228B22;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,255,0,0.5);
      touch-action: none;
    }
    #score, #time {
      position: absolute;
      top: 12px;
      font-size: 1.3rem;
      z-index: 10;
      font-weight: bold;
      text-shadow: 0 0 8px currentColor;
    }
    #score { left: 15px; color: #0f0; }
    #time { right: 15px; color: #ffcc00; }
    #chef {
      position: absolute;
      bottom: 0;
      width: 120px;
      height: auto;
      pointer-events: none;
      z-index: 5;
      will-change: left;
    }
    .item {
      position: absolute;
      font-size: 38px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
    .item.hit {
      animation: explode 0.35s ease-out forwards;
    }
    @keyframes explode {
      0% { transform: scale(1.4) rotate(15deg); opacity: 1; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }
    .points {
      position: absolute;
      font-size: 26px;
      font-weight: bold;
      pointer-events: none;
      animation: float-up 1s ease-out forwards;
      z-index: 15;
      text-shadow: 0 0 10px currentColor;
    }
    @keyframes float-up {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
    }
    #start-btn {
      margin-top: 16px;
      padding: 14px 32px;
      font-size: 1.25rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff4500, #ff6600);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255,69,0,0.4);
    }
    #start-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <h1>🍕 Del Col Pizzaria 🍕</h1>
  <div class="instructions">Pegue os alimentos e não pegue os emojis!</div>

  <div id="game-container">
    <div id="score">Score: 0</div>
    <div id="time">Tempo: 45</div>
    <img id="chef" src="bonequinhofinal.png" alt="Chef Del Col">
  </div>

  <button id="start-btn">▶️ JOGAR AGORA! ▶️</button>

  <script>
    const container = document.getElementById('game-container');
    const scoreElement = document.getElementById('score');
    const timeElement = document.getElementById('time');
    const chef = document.getElementById('chef');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let gameActive = false;
    let timeLeft = 45;
    let timerId;
    let chefHeight = 0;
    let trayHeight = 65;

    const items = [
      { emoji: '🥓', points: 5, rarity: 0.15 },
      { emoji: '🧀', points: 4, rarity: 0.15 },
      { emoji: '🧅', points: 3, rarity: 0.15 },
      { emoji: '🧄', points: 3, rarity: 0.15 },
      { emoji: '🍅', points: 2, rarity: 0.10 },
      { emoji: '🌿', points: 2, rarity: 0.10 },
      { emoji: '😈', points: -5, rarity: 0.07 },
      { emoji: '💣', points: -5, rarity: 0.07 },
      { emoji: '🤪', points: -5, rarity: 0.06 }
    ];

    chef.onload = function() {
      chefHeight = this.offsetHeight;
    };

    function moveChef(e) {
      if (!gameActive) return;
      e.preventDefault();

      const rect = container.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      let targetX = clientX - rect.left - (chef.offsetWidth / 2);

      targetX = Math.max(0, Math.min(targetX, container.offsetWidth - chef.offsetWidth));
      chef.style.left = targetX + 'px';
    }

    container.addEventListener('mousemove', moveChef);
    container.addEventListener('touchmove', moveChef, { passive: false });
    container.addEventListener('touchstart', moveChef, { passive: false });

    function createPoints(x, points) {
      const pointsEl = document.createElement('div');
      pointsEl.classList.add('points');
      pointsEl.textContent = points > 0 ? `+${points}` : points;
      pointsEl.style.color = points > 0 ? '#0f0' : '#f00';
      pointsEl.style.left = (x - 15) + 'px';
      pointsEl.style.top = (container.offsetHeight - chefHeight + 10) + 'px';
      container.appendChild(pointsEl);

      setTimeout(() => pointsEl.remove(), 1000);
    }

    function createItem() {
      if (!gameActive) return;

      const count = Math.floor(Math.random() * 2) + 1;
      for (let i = 0; i < count; i++) {
        const rand = Math.random();
        let cumulative = 0;
        let selectedItem = items[0];
        
        for (let item of items) {
          cumulative += item.rarity;
          if (rand <= cumulative) {
            selectedItem = item;
            break;
          }
        }

        const item = document.createElement('div');
        item.classList.add('item');
        item.textContent = selectedItem.emoji;
        item.dataset.points = selectedItem.points;

        const x = Math.random() * (container.offsetWidth - 60) + 30;
        item.style.left = x + 'px';
        item.style.top = '-50px';

        container.appendChild(item);

        let posY = -50;
        const speed = 2.5 + Math.random() * 2.5;
        const itemX = parseFloat(item.style.left);

        function fall() {
          if (!gameActive) {
            item.remove();
            return;
          }

          posY += speed;
          item.style.top = posY + 'px';

          const chefLeft = parseFloat(chef.style.left) || 0;
          const chefRight = chefLeft + chef.offsetWidth;
          const trayTop = container.offsetHeight - chefHeight;
          const trayBottom = trayTop + trayHeight;
          const itemBottom = posY + 45;

          if (itemBottom >= trayTop && itemBottom <= trayBottom &&
              itemX + 35 >= chefLeft && itemX <= chefRight) {
            
            item.classList.add('hit');
            const points = parseInt(item.dataset.points);
            score += points;
            scoreElement.textContent = `Score: ${score}`;
            createPoints(itemX, points);
            setTimeout(() => item.remove(), 350);
            return;
          }

          if (posY > container.offsetHeight + 50) {
            item.remove();
          } else {
            requestAnimationFrame(fall);
          }
        }

        fall();
      }
    }

    function startGame() {
      if (gameActive) return;
      gameActive = true;
      score = 0;
      timeLeft = 45;
      scoreElement.textContent = `Score: ${score}`;
      timeElement.textContent = `Tempo: ${timeLeft}`;
      startBtn.textContent = "🎮 JOGANDO...";
      startBtn.disabled = true;

      document.querySelectorAll('.item, .points').forEach(el => el.remove());

      timerId = setInterval(() => {
        timeLeft--;
        timeElement.textContent = `Tempo: ${timeLeft}`;
        if (timeLeft <= 0) endGame();
      }, 1000);

      const interval = setInterval(() => {
        if (!gameActive) {
          clearInterval(interval);
          return;
        }
        createItem();
      }, 700 + Math.random() * 750);

      chef.style.left = (container.offsetWidth / 2 - chef.offsetWidth / 2) + 'px';
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerId);
      startBtn.textContent = "🔄 JOGAR NOVAMENTE!";
      startBtn.disabled = false;
      alert(`🍕 FIM DE JOGO! Score: ${score} ✨\n\nMandou bem no preparo da pizza da Del Col!`);
    }

    startBtn.addEventListener('click', startGame);
  </script>

</body>
</html>
